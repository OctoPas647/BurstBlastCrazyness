name: Build APK

# Every push to main builds the app and puts the APK on the "latest" release,
# so you can grab it straight from your phone:
# https://github.com/OctoPas647/burstblastcrazyness/releases/latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BurstBlastCrazyness.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BurstBlastCrazyness-apk
          path: BurstBlastCrazyness.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BurstBlastCrazyness.apk \
            --target "${{ github.sha }}" \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Installs over the previous build without losing your scores."
