name: Build APK

# Every push to main builds the app and puts the APK on the "latest" release,
# so you can grab it straight from your phone:
# https://github.com/OctoPas647/BurstBlastCrazyness/releases/latest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already ship the Android SDK (ANDROID_HOME is set);
      # Gradle downloads any missing platform itself.
      - name: Load signing key from secrets (if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from secrets"
          else
            echo "No KEYSTORE_BASE64 secret: signing with the shared key in the repo"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk BurstBlastCrazyness.apk

      - uses: actions/upload-artifact@v5
        with:
          name: BurstBlastCrazyness-apk
          path: BurstBlastCrazyness.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BurstBlastCrazyness.apk \
            --target "${{ github.sha }}" \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Installs over the previous build without losing your scores."
