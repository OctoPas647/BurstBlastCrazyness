<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a0f3d">
  <meta name="description" content="BurstBlastCrazyness — a fair block puzzle. Truly random pieces, no ads, moddable.">
  <title>BurstBlastCrazyness</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='3' fill='%23ff5470'/%3E%3Crect x='17' y='2' width='13' height='13' rx='3' fill='%23ffd84d'/%3E%3Crect x='2' y='17' width='13' height='13' rx='3' fill='%232ec5ff'/%3E%3Crect x='17' y='17' width='13' height='13' rx='3' fill='%23c06cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="play">
    <header class="hud">
      <div class="best"><span class="best-icon" aria-hidden="true"></span><span id="best">0</span></div>
      <button id="btn-menu" class="icon-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
        <span id="mods-badge" class="badge"></span>
      </button>
    </header>

    <div class="score-wrap">
      <div id="score">0</div>
      <div id="combo" class="combo"></div>
    </div>

    <div id="board" class="board" aria-label="Game board"></div>

    <div id="tray" class="tray"></div>

    <button id="seed-chip" class="seed-chip">
      <span class="dot"></span> <span id="chip-label">Fair dealing</span> · seed <b id="seed-text">-</b>
    </button>
  </main>

  <div id="fx"></div>
  <div id="toasts"></div>

  <section id="over" class="over" aria-live="polite">
    <div class="over-card">
      <h2>No space left</h2>
      <div id="over-new-best" class="new-best">New best!</div>
      <div class="over-score" id="over-score">0</div>
      <div class="over-best">Best <span id="over-best">0</span></div>
      <div class="over-stats" id="over-stats"></div>
      <button id="over-new" class="btn big">Play again</button>
      <button id="over-replay" class="btn ghost-btn">Replay same seed</button>
    </div>
  </section>

  <section id="pause" class="over pause" aria-live="polite">
    <div class="over-card pause-card">
      <h2>Paused</h2>
      <div class="pause-scores">
        <div><span>Score</span><b id="pause-score">0</b></div>
        <div><span>Best</span><b id="pause-best">0</b></div>
      </div>
      <div class="pause-toggles">
        <button class="round-toggle" data-setting="sound" aria-label="Sound"><svg viewBox="0 0 24 24" class="ic-on"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg><svg viewBox="0 0 24 24" class="ic-off"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg><small>Sound</small></button>
        <button class="round-toggle" data-setting="haptics" aria-label="Vibration"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v14h6V5H9zM3 8h2v8H3zm16 0h2v8h-2z"/></svg><small>Vibration</small></button>
      </div>
      <button id="pause-resume" class="btn big">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l12-7.5z"/></svg> Resume
      </button>
      <button id="pause-restart" class="btn ghost-btn">Restart</button>
      <div class="pause-links">
        <button data-open="mods">Mods</button>
        <button data-open="fair">Fair play</button>
        <button data-open="settings">Settings</button>
      </div>
    </div>
  </section>

  <section id="sheet" class="sheet">
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-top">
        <nav class="tabs">
          <button data-tab="mods">Mods</button>
          <button data-tab="fair">Fair play</button>
          <button data-tab="settings">Settings</button>
        </nav>
        <button id="sheet-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </section>

  <script src="js/rng.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/mods.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/ui.js"></script>
  <script src="mods/manifest.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
